soc_family: tegra
soc: tegra124  # Change this to your specific Tegra SoC
firmware:
  bootloader:
    # Path to the bootloader binary (typically u-boot or cboot)
    # For Tegra, this could be u-boot.bin or cboot.bin
    path: path/to/bootloader.bin
  u-boot:
    # Path to U-Boot binary
    # This is used if you need to chain-load U-Boot after bootloader
    path: path/to/u-boot.bin